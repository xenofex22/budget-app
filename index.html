      /* Classic Windows/VBA control typography throughout the application. */
      html body,
      html body button,
      html body input,
      html body select,
      html body textarea,
      html body label,
      html body p,
      html body span,
      html body div,
      html body th,
      html body td,
      html body h1,
      html body h2,
      html body h3,
      html body h4 {
        font-family: Tahoma, "MS Sans Serif", Arial, sans-serif !important;
        letter-spacing: 0 !important;
      }

      html body {
        font-size: 13px !important;
      }

      html body button,
      html body input,
      html body select,
      html body textarea {
        font-size: 13px !important;
      }

      html body h1,
      html body h2,
      html body h3,
      html body h4 {
        font-weight: 700 !important;
        text-transform: none !important;
      }

      /* Excel/VBA-style default action: raised Win98 control plus a hard black outer frame. */
      html body form.max-w-4xl button[type="submit"] {
        background: #c0c0c0 !important;
        color: #000000 !important;
        border: 1px solid #000000 !important;
        border-radius: 0 !important;
        outline: 1px solid #000000 !important;
        outline-offset: 2px !important;
        box-shadow:
          inset 1px 1px 0 #ffffff,
          inset 2px 2px 0 #dfdfdf,
          inset -1px -1px 0 #000000,
          inset -2px -2px 0 #808080 !important;
        font-size: 14px !important;
        font-weight: 700 !important;
        padding-top: 10px !important;
        padding-bottom: 10px !important;
      }

      html body form.max-w-4xl button[type="submit"]:active {
        outline: 1px solid #000000 !important;
        outline-offset: 2px !important;
        box-shadow:
          inset 1px 1px 0 #000000,
          inset 2px 2px 0 #808080,
          inset -1px -1px 0 #ffffff,
          inset -2px -2px 0 #dfdfdf !important;
      }
